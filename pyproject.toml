[project]
name = "serts"
version = "0.1.0"
description = "SERTS: Solares Waermenetz mit Erdbeckenspeicher (PTES), Grosswaermepumpe und PtH - Fallstudie Bad Lippspringe"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pypsa>=0.35",
    "linopy",
    "highspy>=1.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "pvlib>=0.11",
    "demandlib>=0.2",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "netcdf4",
]

[project.scripts]
serts = "serts.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "rohdaten: braucht Rohdaten in data/raw (vorher `serts import-raw`)",
    "solver: braucht PyPSA + HiGHS",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]  # Zeilenlänge regelt `ruff format`; lange Docstrings/Quellenangaben erlaubt
