    einheit: "t/MWh"
    status: belegt
    quelle: "UBA: CO2-Emissionen pro kWh Strom 2024 = 363 g/kWh (Themenseite; UBA-FAQ nennt 353 g)"
    sens: [0.2]
  ee_anteil:
