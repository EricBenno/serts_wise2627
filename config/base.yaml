ptes:
  c_wasser:
    wert: 1.163e-3
    einheit: "MWh/(m3 K)"
    status: belegt
    quelle: "rho*cp Wasser ≈ 1000 kg/m3 * 4,187 kJ/(kg K) = 1,163 kWh/(m3 K); BRF §3.2"
    hinweis: "Bei 45-85 degC rho*cp ≈ 1,14-1,15 kWh/(m3 K) (-1...-2 %); vernachlässigt."
  T_oben:
    wert: 85
    einheit: "degC"
    status: vorgabe
    quelle: "BRF §3.1; Liner-Grenze (Xiang et al. 2022)"
    sens: [90]
    hinweis: "Direktentladung braucht T_oben >= T_VL + 5 K = 85 degC -> bei VL 80 genau an der Grenze."
  T_unten:
    wert: 10
    einheit: "degC"
    status: vorgabe
    quelle: "BRF §3.1; DRL Tmin 9-12 degC"
  verlustrate:
    wert: 4.0e-5
    einheit: "1/h"
    status: annahme
    quelle: "BRF §3.2 Startwert, abgeleitet aus DRL (Verluste / mittl. Inhalt ≈ 2.800 MWh)"
    sens: [1.5e-5, 8.0e-5]
    hinweis: "PTES hier ≈7x kleiner als DRL; Oberfläche/Volumen ~ V^(-1/3) -> Faktor ≈1,9 -> obere Sensitivität 8e-5 (docs E10)."
  preisstufen:
    wert: [[0, 5000, 165], [5000, 12000, 124], [12000, 35000, 95]]
    einheit: "[m3 von, m3 bis, EUR/m3]"
    status: annahme
    quelle: "Kostenkurve c = 38,3 EUR/m3 * (V/60.000)^-0,31 * 1,5 aus DRL 60.000 m3 / 38,3 EUR/m3 (SIF, 2014) und Marstal 10.000 m3 / 67 EUR/m3 (DEA 2019), x 1,5 Baupreissteigerung 2014->2025; je Stufe konservativ am unteren Rand ausgewertet: 5.000 m3 -> 124, 12.000 m3 -> 95 EUR/m3; Stufe 1 bei 2.000 m3 -> 165 EUR/m3"
    hinweis: "Je Stufe ein LP-Lauf mit V in [von, bis]; die günstigste Stufe gewinnt (docs E24). Obergrenze 35.000 m3 ≈ ganze Fläche."
  kosten_faktor:
    wert: 1.0
    einheit: "-"
    status: vorgabe
    quelle: "Faktor auf alle Preisstufen (Sensitivität Speicherkosten)"
    sens: [0.7, 1.3]
  volumen_je_grundflaeche:
    wert: 2.65
    einheit: "m3/m2"
    status: annahme
    quelle: "DRL-Geometrie (Pyramidenstumpf 90/26 m, 16 m tief) ähnlich skaliert auf 8.700 m3: Oberkante 47 m, Tiefe 8 m; + 5 m Randstreifen -> 3.280 m2 Grund -> 8.700/3.280"
