netz:
  T_VL:
    wert: 80
    einheit: "degC"
    status: annahme
    quelle: "TEAM: Netz bleibt bei 80 degC Vorlauf wie in der NB (ersetzt BRF-Wert 75 degC)"
    sens: [70, 90, 100, 110]
    hinweis: "Wirkt auf COP Luft- und Speicher-WP, Direktentladung (über 80 °C Boosting, da T_oben 85: 100/110 °C -> 0,5/0,75 MWh je MWh Entladung), Übergangszone und Vorwärmen. Netzverluste bleiben die der Netzberechnung (80/50 °C) -> Vorteil niedriger Vorläufe eher unterschätzt, Kosten hoher Vorläufe auch. 100/110 °C außerhalb der KWW-Stützwerte (Gütegrad Luft-WP bleibt 44 % wie bei 95 °C, WP-Investkosten unverändert) -> eher optimistisch. Im Tornado 70/90/100/110 °C fest; 75/85 °C einzeln (Stand 21.11. in docs/ergebnisse*.md)."
  T_VL_min:
    wert: 80
    einheit: "degC"
    status: annahme
    quelle: "Basis = konstanter Vorlauf (TEAM). Kleiner als T_VL -> gleitender Vorlauf: T_VL bei Tagesmittel <= gleit_T_kalt, linear fallend auf T_VL_min bei >= gleit_T_warm (Szenario vl_gleitend)"
    sens: [60, 70]
    hinweis: "Wirkt stündlich auf den COP von Luft- und Speicher-WP und das Boosting (heatpump.vorlauf). Übergangszone, Vorwärmen und Netzverluste rechnen weiter mit T_VL -> eher vorsichtig. Im Tornado: gleitend 80 -> 60 / 80 -> 70 °C."
  gleit_T_kalt:
    wert: -10
    einheit: "degC"
    status: annahme
    quelle: "übliche Heizkurve Fernwärme: volle Vorlauftemperatur bei Auslegungs-Außentemperatur (Größenordnung -10 bis -12 °C)"
  gleit_T_warm:
    wert: 15
    einheit: "degC"
    status: annahme
    quelle: "übliche Heizkurve: Mindest-Vorlauf ab Heizgrenze ≈ 15 °C (Sommer: Trinkwarmwasser)"
  T_RL:
    wert: 45
    einheit: "degC"
    status: annahme
    quelle: "BRF §2 (TEAM: Rücklauf frei '80/x'); NB rechnet 50 degC"
