    status: vorgabe
    quelle: "TEAM 09.11.2026: Netzkosten in die LCOH einbeziehen (zusätzlich zur LCOH der Erzeugung ausgewiesen)"
  anteil_strasse:
    wert: 0.8
    einheit: "-"
    status: annahme
    quelle: "TEAM: Großteil der Trasse unter Straßen, Rest 'grüne Wiese' – Verhältnis nachsteuerbar"
    sens: [0.5, 1.0]
  kosten_trasse_strasse:
    wert: 650
    einheit: "EUR/m Trasse"
    status: belegt
    quelle: "KWW Tab. 36/37 (2026, netto): Tiefbau befestigtes Terrain (Mittel aus min./max.) + Rohrmaterial, gewichtet mit der Längenverteilung je Rohrdimension der Netzberechnung (PEX 20-100, KMR 100-250): 653 EUR/m, Spanne 366-940 (scripts/kww_trasse.py)"
    sens: [370, 940]
    hinweis: "Vorher 550 EUR/m (Manderfeld/Borderstep 2012 x 1,6). Größere Rohre sind teurer: Netz groß 1.140 EUR/m (config/netze/gross.yaml). docs/entscheidungen.md E32."
  kosten_trasse_gruen:
