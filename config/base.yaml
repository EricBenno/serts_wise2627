# =====================================================================================
# SERTS Basis-Konfiguration – Fallstudie Bad Lippspringe
# =====================================================================================
# Jeder Parameter ist ein Mapping mit:
#   wert:     Zahl/Text/Liste; null = unbekannt (`x` im Schema)
#   einheit:  MW, MWh, m3, degC, ... (Kelvin nur intern im COP)
#   status:   belegt  = mit Primärquelle/Messwert/eigener Rechnung auf Rohdaten
#             vorgabe = Teamentscheidung (Briefing §2), nicht neu diskutieren
#             annahme = begründet, ohne Primärquelle -> braucht Sensitivität, falls ergebnisrelevant
#             offen   = noch zu klären; wert muss null sein
#   quelle:   Quelle oder Begründung (Pflicht außer bei offen)
#   sens:     optional, Sensitivitätswerte
#   hinweis:  optional
# Zugriff im Code über Config.get("pfad.zum.param") -> bricht ab, wenn wert null ist.
# Abkürzungen Quellen: BRF = obsidian/AGENT_BRIEFING_SERTS.md (Stand 08.11.2026),
#   SCH = obsidian/Waermenetz_PTES_Modellschema_v3.md, DRL = Dronninglund (Solites 2019),
#   NB = data/raw/bad_lippspringe/results netzberechnung.xlsx (eigene Netzberechnung des Teams)
# =====================================================================================

