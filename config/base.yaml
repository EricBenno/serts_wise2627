# -------------------------------------------------------------------------------------
ptes:
  c_wasser:
    wert: 1.163e-3
    einheit: "MWh/(m3 K)"
    status: belegt
    quelle: "rho*cp Wasser ≈ 1000 kg/m3 * 4,187 kJ/(kg K) = 1,163 kWh/(m3 K); BRF §3.2"
    hinweis: "Bei 45-85 degC rho*cp ≈ 1,14-1,15 kWh/(m3 K) (-1...-2 %); vernachlässigt."
  T_oben:
    wert: 85
    einheit: "degC"
    status: annahme
    quelle: "BRF §3.1; Liner-Grenze (Xiang et al. 2022)"
    sens: [80, 90]
    hinweis: "Direktentladung braucht T_oben >= T_VL + direkt_dT = 85 degC. Darunter muss WP/PtH nachheizen (Boosting, docs E41): je MWh Entladung (T_VL + dT - T_oben)/(T_oben - T_RL) MWh, z. B. 80 degC -> 0,14. Schauß et al. 2026: Top-Temperatur ist ein Haupttreiber des PTES-Werts."
  austauschrate:
    wert: 0.0094
    einheit: "1/h"
    status: belegt
    quelle: "Messdaten Dronninglund 2014 (PitStorages/DronninglundData, Datei *_flow_rates_2014): höchster Stundenmittelwert des Volumenstroms durch die Diffusoren 565 m3/h (Summe der drei Diffusoren / 2; 10-min-Spitze 610, P99 466) bei 60.000 m3 -> 0,0094 je Stunde"
    sens: [.inf]
    hinweis: "Volumenstrom beim Laden bzw. Entladen <= Rate x V (je Richtung, je Stunde), Wärme = Volumenstrom x c x Spreizung des Temperaturbands. Gemessener Höchstwert, keine Auslegungsgrenze -> eher vorsichtig. .inf = keine Grenze. DEA (Technology Data Energy Storage, PTES): Energie/Leistung 30 h, entspricht ≈ 0,03 je Stunde bei voller Spreizung (Schauß et al. 2026)."
  T_unten:
    wert: 10
    einheit: "degC"
    status: annahme
    quelle: "BRF §3.1; DRL Tmin 9-12 degC"
  verlustrate:
    wert: 4.0e-5
    einheit: "1/h"
    status: annahme
    quelle: "BRF §3.2 Startwert, abgeleitet aus DRL (Verluste / mittl. Inhalt ≈ 2.800 MWh)"
    sens: [1.5e-5, 8.0e-5]
    hinweis: "Gilt bei ptes.V_ref (60.000 m3 = DRL). Für andere Größen x (V/V_ref)^groessen_exponent: z. B. 7.400 m3 -> 8e-5, 1.750 m3 -> 1,3e-4 (docs E39)."
  groessen_exponent:
    wert: -0.3333
    einheit: "-"
    status: annahme
    quelle: "Geometrie: Oberfläche/Volumen ~ V^(-1/3) (Verluste) und Tiefe ~ V^(1/3) (Dicke der Übergangszone bleibt in Metern gleich) bei ähnlicher Form; eigene Abschätzung (docs E10, E39)"
    sens: [0.0]
    hinweis: "Wirkt auf ptes.verlustrate und ptes.uebergang_ref. 0 = größenunabhängig (altes Verhalten). Bei optimiertem Volumen gilt die Untergrenze des Kostensegments (erstes Segment: Mitte)."
  uebergang_ref:
    wert: 0.15
    einheit: "-"
    status: belegt
    quelle: "Messdaten Dronninglund 2014 (PitStorages/DronninglundData, 32 Temperaturfühler, eigene Auswertung docs/validierung_dronninglund.md): Wärme des heißen Bands (über 40 °C), die in Wasser unter 75-80 °C steckt = Median 12-16 % der Kapazität des heißen Teils (P10-P90: 5-30 %)"
    sens: [0.0, 0.1, 0.25]
    hinweis: "Anteil der Übergangszone am heißen Teil bei ptes.V_ref. Größenabhängig (groessen_exponent): 7.400 m3 -> 0,30. Direkt ins Netz geht nur der Kern darüber. 0 = ideale Schichtung. Ersetzt ptes.schicht_min (docs E39)."
  uebergang_max:
    wert: 0.8
    einheit: "-"
    status: annahme
    quelle: "Obergrenze für sehr kleine/flache Speicher (unter ≈ 400 m3), damit ein Kern übrig bleibt; rechnerische Grenze"
  einschicht_anteil:
    wert: 0.0
    einheit: "-"
    status: annahme
    quelle: "Anteil der heiß geladenen Wärme, der sich beim Einschichten mit der Übergangszone mischt. Kalibriergröße gegen den Direktanteil der Speicherentladung in Dronninglund (docs/validierung_dronninglund.md)"
    sens: [0.1, 0.2]
  vorwaermen:
    wert: true
    einheit: "-"
    status: vorgabe
    quelle: "Wasser der Übergangszone (≈ 65 °C) wärmt den Rücklauf auf ≈ 60 °C vor, WP/PtH heizen in derselben Stunde auf Vorlauf nach (übliche Betriebsweise). false = Übergangszone nur über die Speicher-WP nutzbar (docs E39)"
    sens: [false]
  laden_aus_netz:
    wert: true
    einheit: "-"
    status: vorgabe
    quelle: "true = WP und PtH dürfen den heißen Teil laden (sinnvoll bei zeitvariablem Strompreis, Basis Day-Ahead seit E43); false = der Speicher nimmt nur Solarwärme auf (docs E29)"
    sens: [false]
    hinweis: "Tornado false = Szenario ohne_laden_aus_netz (Speicher nur solar geladen)."
  direkt_dT:
    wert: 5
    einheit: "K"
    status: annahme
    quelle: "BRF §3.1: Direktentladung braucht T_oben >= T_VL + 5 K (Wärmeübertrager/Übergabe)"
  kosten_ref:
    wert: 67.77
    einheit: "EUR/m3"
    status: belegt
    quelle: "KWW Tab. 52 (Erdbeckenspeicher): Kostenkurve Invest = 1093,6 * V^0,7472 (2026, netto) bei V_ref = 60.000 m3 -> 67,8 EUR/m3; Stützwerte 20.000 m3 90, 50.000 m3 70, 100.000 m3 60, 200.000 m3 50 EUR/m3"
    hinweis: "Frühere Basis (SIF/DRL 2014: 38,3 EUR/m3 bei 60.000 m3 x Index 1,5 = 57,5) liegt bei 60.000 m3 ≈ 15 % niedriger; bei 1.600 m3 praktisch gleich (175 vs. 168 EUR/m3). docs/entscheidungen.md E32."
  V_ref:
    wert: 60000
    einheit: "m3"
    status: belegt
    quelle: "Bezugsgröße der Kostenkurve (innerhalb der KWW-Stützwerte 20.000-200.000 m3)"
  kosten_exponent:
    wert: -0.2528
    einheit: "-"
    status: belegt
    quelle: "KWW Tab. 52: Invest ~ V^0,7472 -> spezifisch ~ V^-0,2528"
    sens: [-0.2, -0.4]
    hinweis: "Gültigkeit laut KWW 20.000-200.000 m3; darunter (Basisfall klein: 1.000-6.000 m3) extrapoliert -> unsicher, Sensitivität ptes.kosten_faktor. Marstal 10.000 m3 real ≈ 67 EUR/m3 (2014)."
  preisindex:
    wert: 1.0
    einheit: "-"
    status: vorgabe
    quelle: "KWW-Kosten gelten bereits für 2026 (netto, real) -> kein Index nötig (Preisbasis 2025/26 ≈ gleich)"
    sens: [1.3]
    hinweis: "Bei Rückgriff auf Preise älterer Projekte (DRL 2014) Index ≈ 1,5 einsetzen."
  segmente_m3:
    wert: [0, 1000, 2500, 6000, 12000, 35000]
    einheit: "m3"
    status: vorgabe
    quelle: "Stützstellen der stückweise linearen Kostenfunktion C(V) = V * c(V) (stetig, konkav); je Segment ein LP-Lauf mit Grenzkosten und Fixkostenanteil (docs E30)"
    hinweis: "Obergrenze 35.000 m3 ≈ ganze Fläche. Mehr Stützstellen = genauer, aber ein Lauf mehr je Stelle."
  kosten_faktor:
    wert: 1.0
    einheit: "-"
    status: vorgabe
    quelle: "Faktor auf die gesamte Speicherkostenkurve (Sensitivität Speicherkosten)"
    sens: [0.7, 1.3]
  volumen_je_grundflaeche:
    wert: 2.65
    einheit: "m3/m2"
    status: annahme
    quelle: "DRL-Geometrie (Pyramidenstumpf 90/26 m, 16 m tief) ähnlich skaliert auf 8.700 m3: Oberkante 47 m, Tiefe 8 m; + 5 m Randstreifen -> 3.280 m2 Grund -> 8.700/3.280"
    sens: [2.0, 4.0]

# -------------------------------------------------------------------------------------
kollektor:
  typ:
    wert: flachkollektor
    einheit: "-"
    status: vorgabe
    quelle: "SCH A3 (wie DRL)"
  modell:
    wert: "Großflächen-Flachkollektor mit Konvektionsfolie, Typ Arcon-Sunmark HTHEATstore 35/10 (wie DRL)"
    einheit: "-"
    status: annahme
    quelle: "SIF Kap. 2: DRL nutzt Arcon 35/10 HEATstore mit Folie; Solar-Keymark-Zertifikat SP SC0843-14"
    hinweis: "Keymark-Datenblatt war am 09.11.2026 nicht abrufbar (solarkeymark.nl Verbindung abgelehnt) -> eta0/a1/a2 unten sind Annahmen in der BRF-Bandbreite."
  eta0:
    wert: 0.80
    einheit: "-"
    status: annahme
    quelle: "Mitte der BRF-Bandbreite 0,75-0,82 für große Flachkollektoren; Bezug Bruttofläche"
    sens: [0.75, 0.82]
    hinweis: "Durch Keymark SP SC0843-14 ersetzen. Plausibilisierung: spez. Ertrag vs. BSW 430-500 kWh/(m2 a)."
  a1:
    wert: 2.4
    einheit: "W/(m2 K)"
    status: annahme
    quelle: "BRF-Bandbreite 2-2,5 W/(m2 K), oberes Drittel (konservativ)"
  a2:
    wert: 0.012
    einheit: "W/(m2 K2)"
    status: annahme
    quelle: "BRF-Bandbreite 0,01-0,016 W/(m2 K2)"
  T_m:
    wert: 67.5
    einheit: "degC"
    status: annahme
    quelle: "BRF §3.3: mittlere Kollektortemperatur 50 -> 85 degC; ein Niveau für Direktnutzung und Speicherladen (docs E20)"
  iam_b0:
    wert: 0.1
    einheit: "-"
    status: annahme
    quelle: "Einfallswinkel-Korrektur der Direktstrahlung nach ASHRAE: K = 1 - b0 * (1/cos(Winkel) - 1); b0 ≈ 0,1 ist der übliche Wert für einfach verglaste Flachkollektoren (K ≈ 0,94 bei 50°). Durch Keymark-Wert K(50°) ersetzen"
    sens: [0.0, 0.15]
    hinweis: "0 = keine Korrektur (altes Verhalten). Diffusstrahlung bleibt unkorrigiert (einfach gehalten)."
  feldverluste:
    wert: 0.10
    einheit: "-"
    status: annahme
    quelle: "BRF §3.3 Startwert"
    sens: [0.05, 0.15]
  neigung:
    wert: 35
    einheit: "deg"
    status: annahme
    quelle: "TEAM: einfache Annahme; 35 deg = übliche Neigung großer Freiflächenfelder in DE/DK (Kompromiss Ertrag/Reihenabstand)"
    sens: [25, 45]
  azimut:
    wert: 180
    einheit: "deg"
    status: annahme
    quelle: "Südausrichtung (pvlib-Konvention 180 = Süd), Standard bei Freifeldanlagen"
  flaechenfaktor:
