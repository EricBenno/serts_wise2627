# Szenario: auch WP, PtH, Netz-Lebensdauer aus dem KWW Technikkatalog, Größenklassen für das große Netz
# (WP ≈ 5-10 MW, PtH/Gaskessel ≈ 15-17 MW). Aufruf: uv run serts run --netz gross --szenario kww_komplett_gross
# Gegenstück für das kleine Netz: kww_komplett.

