    wert: 1400000
    einheit: "EUR/MW_th"
    status: belegt
    quelle: "KWW Tab. 24 (Kompressions-WP Luft, zweistufig, 70 °C, 2026, netto): 1.440 EUR/kW bei 5 MW, 1.340 EUR/kW bei 10 MW -> 1.400 EUR/kW, Unsicherheit ±30 %"
    hinweis: "Basis (Frederikssund 2022, DK, NH3): 1,0 Mio. EUR/MW. Das KWW enthält keine Speicher-WP -> gleicher Satz für beide Teile angenommen."
